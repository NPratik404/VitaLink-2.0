<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bed Allocation | VitaLink</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="glass-panel" style="margin: 2rem auto; max-width: 1200px;">
        <a href="index.html" class="logo">
            <i class="fa-solid fa-bed-pulse"></i>
            Bed Allocation
        </a>
        <nav>
            <a href="er-dashboard.html"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        </nav>
    </header>

    <main class="container">
        
        <div id="allocationContext" class="glass-panel mb-2 hidden" style="padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; border-color: var(--primary);">
            <div>
                <h3 style="color: var(--primary); margin-bottom: 0.25rem;">Assigning Bed For:</h3>
                <h2 id="patientName" style="font-size: 1.5rem;">Patient Name</h2>
            </div>
            <div id="patientPriorityBadge" class="badge badge-red">
                Priority
            </div>
        </div>

        <section class="glass-panel" style="padding: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2 class="card-title">ER Layout Map</h2>
                <div style="display: flex; gap: 1.5rem; font-size: 0.9rem;">
                    <span><i class="fa-solid fa-square" style="color: rgba(42, 157, 143, 0.5);"></i> Available</span>
                    <span><i class="fa-solid fa-square" style="color: rgba(231, 111, 81, 0.5);"></i> Occupied</span>
                </div>
            </div>

            <!-- The Grid Map -->
            <div id="bedGrid" class="grid grid-cols-5" style="gap: 1.5rem;">
                <!-- Generated by JS -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const incidentId = urlParams.get('incidentId');
        let pendingPatient = null;

        function loadContext() {
            if(incidentId) {
                const queue = VitaLinkAPI.getERQueue();
                pendingPatient = queue.find(q => q.incidentId === incidentId);
                
                if (pendingPatient) {
                    const ctx = document.getElementById('allocationContext');
                    ctx.classList.remove('hidden');
                    ctx.classList.add('fade-in');
                    document.getElementById('patientName').innerText = pendingPatient.patient.name;
                    
                    const badge = document.getElementById('patientPriorityBadge');
                    badge.className = `badge badge-${pendingPatient.priority}`;
                    badge.innerText = `Triage Level: ${pendingPatient.priority.toUpperCase()}`;
                } else {
                    showToast("Patient not found in queue. They may have already been allocated.", "warning");
                }
            }
        }

        function renderBeds() {
            const container = document.getElementById('bedGrid');
            container.innerHTML = '';
            container.classList.remove('grid', 'grid-cols-5'); // We will create custom grids per floor
            
            const beds = VitaLinkAPI.getBeds();
            const floors = [...new Set(beds.map(b => b.floor))];

            floors.forEach(f => {
                const floorBeds = beds.filter(b => b.floor === f);
                
                const floorSection = document.createElement('div');
                floorSection.style.marginBottom = '3rem';
                
                floorSection.innerHTML = `
                    <h3 style="color: var(--text-secondary); margin-bottom: 1rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem;">
                        <i class="fa-solid fa-layer-group"></i> Floor ${f}
                    </h3>
                    <div class="grid grid-cols-5" style="gap: 1.5rem;"></div>
                `;
                
                const grid = floorSection.querySelector('.grid');
                
                floorBeds.forEach((bed, index) => {
                    const slot = document.createElement('div');
                    slot.className = `bed-slot glass-panel fade-in ${bed.status}`;
                    slot.style.animationDelay = `${(index % 5) * 0.1}s`;

                    let icon = bed.status === 'available' ? 'fa-bed' : 'fa-bed-pulse';
                    
                    slot.innerHTML = `
                        <i class="fa-solid ${icon}"></i>
                        <strong>${bed.id}</strong>
                    `;

                    if (bed.status === 'available') {
                        slot.onclick = () => handleAllocate(bed.id);
                    } else if (bed.status === 'occupied') {
                        slot.innerHTML += `
                            <div class="bed-slot-info">
                                <strong>${bed.incident.patient.name}</strong><br>
                                <span class="text-secondary" style="font-size: 0.8rem;">${bed.incident.patient.history[0] || 'No major history'}</span><br>
                                <span class="badge badge-${bed.incident.priority}" style="margin-top: 0.5rem; font-size: 0.7rem;">${bed.incident.priority.toUpperCase()}</span>
                                <hr style="margin: 0.5rem 0; border-color: var(--glass-border);">
                                <button class="btn btn-outline" style="padding: 0.2rem 0.5rem; font-size: 0.8rem; width: 100%;" onclick="handleFree('${bed.id}')">Discharge / Free Bed</button>
                            </div>
                        `;
                    }
                    grid.appendChild(slot);
                });
                
                container.appendChild(floorSection);
            });
        }

        async function handleAllocate(bedId) {
            if (!pendingPatient) {
                showToast("Select a patient from the ER Dashboard first.", "warning");
                return;
            }

            if(confirm(`Allocate ${pendingPatient.patient.name} to ${bedId}?`)) {
                try {
                    VitaLinkAPI.allocateBed(bedId, incidentId);
                    showToast(`Successfully allocated ${bedId}`, "success");
                    pendingPatient = null;
                    document.getElementById('allocationContext').classList.add('hidden');
                    renderBeds();
                    setTimeout(() => {
                        window.location.href = 'er-dashboard.html';
                    }, 1500);
                } catch(e) {
                    showToast(e.message, "danger");
                }
            }
        }

        function handleFree(bedId) {
            // Prevent event bubbling to the parent
            event.stopPropagation();
            if(confirm(`Are you sure you want to free ${bedId}?`)) {
                VitaLinkAPI.freeBed(bedId);
                showToast(`${bedId} is now available.`, "success");
                renderBeds();
            }
        }

        // Init
        loadContext();
        renderBeds();

    </script>
</body>
</html>
