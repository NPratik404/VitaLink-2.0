<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramedic Login | VitaLink</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <header class="glass-panel" style="margin: 1rem auto; max-width: 95%;">
        <a href="index.html" class="logo">
            <i class="fa-solid fa-staff-snake"></i>
            VitaLink
        </a>
    </header>

    <main class="container" style="display: flex; align-items: center; justify-content: center; min-height: 80vh;">
        <div class="glass-panel fade-in" style="width: 100%; max-width: 400px; padding: 2.5rem;">
            <h2 class="text-center" style="margin-bottom: 2rem;"><i class="fa-solid fa-truck-medical" style="color: var(--primary);"></i> Paramedic Portal</h2>
            
            <div id="loginError" class="badge badge-red hidden" style="width: 100%; margin-bottom: 1rem; text-align: center; display: block;">Invalid Credentials</div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Select Role</label>
                    <select id="username" class="form-control" required>
                        <option value="EMT">EMT</option>
                        <option value="Paramedic">Paramedic</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">Login <i class="fa-solid fa-arrow-right"></i></button>
            </form>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            try {
                Auth.login(user, pass);
                window.location.href = 'paramedic.html';
            } catch (err) {
                document.getElementById('loginError').classList.remove('hidden');
                document.getElementById('password').value = '';
            }
        }
    </script>
</body>
</html>
